spring.application.name=api-gateway
server.port=3000

# Servicio cliente:
spring.cloud.gateway.server.webflux.routes[0].id=servicio-cliente
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:3001
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clientes/**

# Servicio producto

spring.cloud.gateway.server.webflux.routes[1].id=servicio-producto
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:3002
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/**

# Servicio facturas

spring.cloud.gateway.server.webflux.routes[2].id=servicio-factura
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:3003
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/facturas/**

# Ruta que no coincide
spring.cloud.gateway.server.webflux.routes[3].id=not-found
spring.cloud.gateway.server.webflux.routes[3].uri=forward:/not-found
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/**

# Prioridad 1 alta, 10 media, 100 baja o comun

