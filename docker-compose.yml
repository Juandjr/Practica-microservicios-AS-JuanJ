services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: cliente
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    volumes:
      - postgres_data: /var/lib/postgresql/data
    networks:
      - microservices-network
    healtcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cliente"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    volumes:
      - mongodb_data:/datadb
    networks:
      - microservices-network
    healtcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommunity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  servicio-cliente:
    build:
      context: ./servicio-cliente/
      dockerfile: Dockerfile
    container_name: servicio-cliente
    environments:
      DB_NAME: cliente
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      DB_HOST: postgres
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  servicio-producto:
    build:
      context: ./servicio-producto/
      dockerfile: Dockerfile
    container_name: servicio-producto
    environments:
      DATABASE_URL: sqlite:////app/data/producto.db
    volumens:
      - ./servicio-producto/data:/app/data
    networks:
      - microservices-network
    restart: unless-stopped

  servicio-factura:
    build:
      context: ./servicio-factura/
      dockerfile: Dockerfile
    container_name: servicio-factura
    environments:
      DATABASE_URL: "mongodb://mongodb:27017/factura"
      PORT: 3003
      URL_SERVICE: "http://servicio-producto:3002/api/productos"
      URL_CLIENTES: "http//servicio-cliente:3001/api/clientes"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway/
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environments:
      SERVER_PORT: 3000
      CLIENTE_SERVICE_UR: http://servicio-cliente:3001
      PRODUCTO_SERVICE_URL: http://servicio-producto:3002
      FACTURA_SERVICE_URL: http://servicio-service:3003
    depends_on:
      servicio-cliente:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-networks:
    drivers: bridge

volumes:
  postgres_data:
  mongodb_data:
